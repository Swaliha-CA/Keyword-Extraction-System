
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyword Extraction System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0001;
        }

        h1 { color: #3730a3; text-align: center; }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        select, button {
            padding: 12px;
            margin-top: 12px;
            border-radius: 7px;
            font-size: 15px;
        }

        select { width: 100%; border: 1px solid #ccc; }

        button {
            width: 100%;
            background: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover { background: #3730a3; }

        .results {
            margin-top: 25px;
            padding: 15px;
            background: #f5f5ff;
            border-radius: 8px;
        }

        .error { color: #c62828; }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Keyword Extraction System</h1>
    <p>Enter your text below to extract important keywords.</p>

    <form method="POST" action="/">
        <label for="text"><strong>Enter your text:</strong></label>
        <br><br>

        <textarea id="text" name="text"
            placeholder="Paste your paragraph, article, or research abstract here..."
            required>{{ text }}</textarea>

        <label for="method"><strong>Choose extraction method:</strong></label>
        <select id="method" name="method">
            <option value="tfidf"
                {% if method == 'tfidf' %}selected{% endif %}>
                TF-IDF
            </option>
            <option value="rake"
                {% if method == 'rake' %}selected{% endif %}>
                RAKE
            </option>
            <option value="frequency"
                {% if method == 'frequency' %}selected{% endif %}>
                Word Frequency
            </option>
        </select>

        <label for="top_n"><strong>Number of keywords:</strong></label>
        <select id="top_n" name="top_n">
            {% for n in [5, 10, 15, 20, 25] %}
            <option value="{{ n }}"
                {% if top_n == n %}selected{% endif %}>
                {{ n }} keywords
            </option>
            {% endfor %}
        </select>

        <button type="submit">Extract Keywords</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if results %}
    <div class="results">
        <h2>Extracted Keywords</h2>

        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Keyword</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody>
                {% for item in results %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ item.keyword }}</td>
                    <td>{{ item.score }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <form method="POST" action="/download">
            <input type="hidden" name="rows"
                value="{% for item in results %}{{ item.keyword }}&#9;{{ item.score }}{% if not loop.last %}&#10;{% endif %}{% endfor %}">
            <button type="submit">Download CSV</button>
        </form>
    </div>
    {% endif %}
</div>
</body>
</html>
